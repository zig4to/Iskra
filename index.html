<!DOCTYPE html>
<html lang="sl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iskra</title>
  <meta name="description" content="Iskra — ideje in izboljšave, ki jih je treba dodati po aplikacijah. Kot issues, na enem mestu." />
  <meta name="theme-color" content="#14100d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Iskra" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="syncBtn" class="sync-btn" type="button" title="Sinhroniziraj" aria-label="Sinhroniziraj z oblakom">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 15a5 5 0 0 1 .5-9.9A6 6 0 0 1 19 8a4.5 4.5 0 0 1-1 8.9H7Z"/>
    </svg>
  </button>

  <button id="hardResetBtn" class="hard-reset-btn" type="button" title="Trdo osveži (Ctrl+F5)" aria-label="Trdo osveži aplikacijo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/>
    </svg>
  </button>

  <header class="hero">
    <div class="brand">
      <span class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z" fill="currentColor"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>Iskra</h1>
        <p class="tag">Ideje in izboljšave za moje aplikacije</p>
      </div>
    </div>
  </header>

  <!-- Zložljiva razdelka: klik na naslov skrije/pokaže .section-body (glej
       setupCollapsible v script.js). -->
  <section class="fold-section" id="appsSection" data-fold-key="iskra-aplikacije-zlozeno" aria-labelledby="appsTitle">
    <h3 class="section-title" id="appsTitle">
      <button type="button" class="section-toggle" aria-expanded="true" aria-controls="tabs">
        Aplikacije
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </h3>
    <nav class="tabs section-body" id="tabs" aria-label="Aplikacije"></nav>
  </section>

  <section class="fold-section recent" id="recentSection" data-fold-key="iskra-nazadnje-zlozeno" aria-labelledby="recentTitle" hidden>
    <h3 class="section-title" id="recentTitle">
      <button type="button" class="section-toggle" aria-expanded="true" aria-controls="recentStrip">
        Nazadnje dodano
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
    </h3>
    <div class="recent-strip section-body" id="recentStrip"></div>
  </section>

  <main class="panel">
    <div class="panel-head">
      <h2 id="panelTitle"></h2>
      <!-- Na telefonu je gumb tu (v vrsti z "Odpri aplikacijo") in odpre okno
           za vnos; na namizju je namesto tega vnosno polje spodaj. -->
      <button type="button" id="addCatHeadBtn" class="add-cat-btn-head">+ Kategorija</button>
      <a id="panelLink" class="open-link" href="#" target="_blank" rel="noopener" title="Odpri aplikacijo" aria-label="Odpri aplikacijo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
      </a>
    </div>

    <form class="add-cat-form" id="addCatForm">
      <input id="addCatInput" placeholder="Nova kategorija…" autocomplete="off" />
      <button type="submit">+ Kategorija</button>
    </form>

    <div class="categories" id="categories"></div>
  </main>

  <dialog class="cat-dialog" id="addCatDialog" aria-labelledby="addCatDialogTitle">
    <form id="addCatDialogForm">
      <h3 id="addCatDialogTitle">Nova kategorija</h3>
      <input id="addCatDialogInput" placeholder="Ime kategorije…" autocomplete="off" />
      <div class="cat-dialog-actions">
        <button type="button" id="addCatDialogCancel">Prekliči</button>
        <button type="submit" class="primary">Dodaj</button>
      </div>
    </form>
  </dialog>

  <script src="sync.js"></script>
  <script src="script.js"></script>
  <script src="install-promo.js"></script>
</body>
</html>
